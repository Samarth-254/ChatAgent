<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatAgent</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" id="newChatBtn" aria-label="Start new chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New chat
        </button>
      </div>
      <div class="sessions-list" id="sessionsList">
        <!-- Sessions injected here -->
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="top-bar">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <span class="session-title" id="currentSessionTitle">Chat</span>
      </header>

      <div class="chat-container" id="chatContainer">
        <!-- Empty state greeting -->
        <div class="empty-state" id="emptyState">
          <h1 class="greeting-heading">Where should we begin?</h1>
          <p class="greeting-sub">Ask anything with live web search, date awareness, and cross-session memory.</p>
          <div class="suggestions-grid">
            <button class="suggestion-chip" data-prompt="On Monday we shortlisted 5 CRM tools for a 20-person sales team. Has any of them changed pricing or shipped something big since?">
              "On Monday we shortlisted 5 CRM tools for a 20-person sales team. Has any of them changed pricing or shipped something big since?"
            </button>
            <button class="suggestion-chip" data-prompt="What did I ask you on 3 November? Is your answer still correct today?">
              "What did I ask you on 3 November? Is your answer still correct today?"
            </button>
            <button class="suggestion-chip" data-prompt="Last Tuesday I asked you about Postgres hosting. Has any pricing changed since then?">
              "Last Tuesday I asked you about Postgres hosting. Has any pricing changed since then?"
            </button>
          </div>
        </div>

        <div class="messages-list" id="messagesList"></div>
      </div>

      <!-- Fixed Composer -->
      <footer class="composer-container">
        <form class="composer-form" id="composerForm">
          <textarea
            id="userInput"
            rows="1"
            placeholder="Send a message..."
            autofocus
            aria-label="User prompt input"
          ></textarea>
          <div class="composer-actions">
            <button type="button" class="stop-btn hidden" id="stopBtn" title="Stop generation">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="6" width="12" height="12" rx="2"></rect>
              </svg>
            </button>
            <button type="submit" class="send-btn" id="sendBtn" title="Send message">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
          </div>
        </form>
      </footer>
    </main>
  </div>

  <!-- Local vendor scripts -->
  <script src="/vendor/marked.js"></script>
  <script src="/vendor/purify.js"></script>
  <script src="/app.js"></script>
</body>
</html>
